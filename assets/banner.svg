<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="35%" stop-color="#170a2e"/>
      <stop offset="65%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <clipPath id="planetClip">
      <circle cx="700" cy="112" r="56"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="url(#sky)"/>

  <circle cx="140" cy="60" r="90" fill="url(#nebula1)" filter="url(#soft)"/>
  <circle cx="520" cy="30" r="120" fill="url(#nebula2)" filter="url(#soft)"/>

  <g>
    <circle cx="80" cy="30" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="55" r="1" fill="#ffffff"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="20" r="1.6" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="45" r="1.1" fill="#ffffff"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="15" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1" fill="#ffffff"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="70" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="75" r="1" fill="#ffffff"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="90" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="110" r="1" fill="#ffffff"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="40" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="150" r="1" fill="#ffffff"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>

    <g stroke="#e9d5ff" stroke-width="1">
      <path d="M110 15 L110 25 M105 20 L115 20" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.5s" repeatCount="indefinite"/></path>
      <path d="M440 90 L440 100 M435 95 L445 95" opacity="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></path>
      <path d="M780 100 L780 110 M775 105 L785 105" opacity="0.9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.7s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="112" r="56" fill="url(#planet)"/>
    <g clip-path="url(#planetClip)" stroke="#170a2e" stroke-width="4" opacity="0.55">
      <line x1="640" y1="126" x2="760" y2="126"/>
      <line x1="640" y1="136" x2="760" y2="136"/>
      <line x1="640" y1="148" x2="760" y2="148"/>
      <line x1="640" y1="162" x2="760" y2="162"/>
    </g>
    <ellipse cx="700" cy="112" rx="82" ry="12" fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.4"/>
  </g>

  <line x1="0" y1="150" x2="900" y2="150" stroke="#c4b5fd" stroke-width="1.2" opacity="0.5"/>

  <g stroke="#a855f7" stroke-width="1" opacity="0.45">
    <line x1="450" y1="150" x2="0" y2="220"/>
    <line x1="450" y1="150" x2="110" y2="220"/>
    <line x1="450" y1="150" x2="230" y2="220"/>
    <line x1="450" y1="150" x2="340" y2="220"/>
    <line x1="450" y1="150" x2="450" y2="220"/>
    <line x1="450" y1="150" x2="560" y2="220"/>
    <line x1="450" y1="150" x2="670" y2="220"/>
    <line x1="450" y1="150" x2="790" y2="220"/>
    <line x1="450" y1="150" x2="900" y2="220"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1" opacity="0.35">
    <line x1="0" y1="164" x2="900" y2="164"/>
    <line x1="0" y1="181" x2="900" y2="181"/>
    <line x1="0" y1="201" x2="900" y2="201"/>
  </g>

  <text x="40" y="102" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="42" fill="url(#title)">MOKSH BHALODIYA</text>
  <text x="42" y="132" font-family="Consolas, 'Courier New', monospace" font-weight="600" font-size="19" fill="#e9d5ff" opacity="0.92">&gt;_ Generative AI Engineer</text>
</svg>
