<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020207"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0"/>
      <stop offset="28%" stop-color="#86efac" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#16a34a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="32%" stop-color="#5eead4" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#0f766e" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8b8cf6" stop-opacity="0.78"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e3f4fb"/>
      <stop offset="70%" stop-color="#a9d8ef"/>
      <stop offset="100%" stop-color="#5a8fc2"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ef9c9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textShield" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <filter id="auroraFilter1" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.014" numOctaves="4" seed="3" result="noise">
        <animate attributeName="baseFrequency" values="0.004 0.014;0.006 0.010;0.004 0.014" dur="24s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="220" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="auroraFilter2" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.012" numOctaves="4" seed="11" result="noise">
        <animate attributeName="baseFrequency" values="0.005 0.012;0.007 0.016;0.005 0.012" dur="28s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="230" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="auroraFilter3" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.016" numOctaves="4" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.005 0.016;0.008 0.012;0.005 0.016" dur="20s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="200" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="shinyGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="230" fill="url(#base)"/>

  <g style="mix-blend-mode:screen">
    <rect x="-250" y="-200" width="700" height="600" fill="url(#greenGrad)" filter="url(#auroraFilter1)" transform="rotate(-10 180 90)"/>
    <rect x="80" y="-220" width="740" height="620" fill="url(#violetGrad)" filter="url(#auroraFilter2)" transform="rotate(8 530 90)"/>
    <rect x="300" y="-200" width="620" height="600" fill="url(#greenGrad2)" filter="url(#auroraFilter3)" transform="rotate(-6 650 80)"/>
  </g>

  <g fill="#ffffff">
    <circle cx="70" cy="25" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="30" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="190" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="185" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="15" r="1" opacity="0.55"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="10" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="35" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="20" r="1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="185" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="20" r="0.9" opacity="0.45"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="175" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="120" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="90" r="0.9" opacity="0.45"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="200" r="1" opacity="0.45"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="205" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#ffffff">
    <g filter="url(#shinyGlow)">
      <circle cx="120" cy="55" r="1.8" opacity="0.9"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <path d="M120,49 L120,61 M114,55 L126,55" stroke="#ffffff" stroke-width="0.6" opacity="0.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></path>
    </g>
    <g filter="url(#shinyGlow)">
      <circle cx="780" cy="165" r="1.7" opacity="0.85"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></circle>
      <path d="M780,159 L780,171 M774,165 L786,165" stroke="#ffffff" stroke-width="0.6" opacity="0.75"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></path>
    </g>
    <g filter="url(#shinyGlow)">
      <circle cx="920" cy="45" r="1.6" opacity="0.85"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="2.8s" repeatCount="indefinite"/></circle>
      <path d="M920,39 L920,51 M914,45 L926,45" stroke="#ffffff" stroke-width="0.6" opacity="0.75"><animate attributeName="opacity" values="0.35;0.95;0.35" dur="2.8s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <g stroke="#cfe0ff" stroke-width="0.6" opacity="0.16">
    <line x1="620" y1="50" x2="700" y2="85"/>
    <line x1="700" y1="85" x2="670" y2="145"/>
    <line x1="670" y1="145" x2="760" y2="165"/>
    <line x1="760" y1="165" x2="830" y2="115"/>
    <line x1="700" y1="85" x2="780" y2="55"/>
    <line x1="780" y1="55" x2="850" y2="90"/>
  </g>
  <g fill="#dbe6ff" opacity="0.4">
    <circle cx="620" cy="50" r="1.6" filter="url(#nodeGlow)"/>
    <circle cx="700" cy="85" r="1.6" filter="url(#nodeGlow)"/>
    <circle cx="670" cy="145" r="1.4" filter="url(#nodeGlow)"/>
    <circle cx="760" cy="165" r="1.4" filter="url(#nodeGlow)"/>
    <circle cx="830" cy="115" r="1.6" filter="url(#nodeGlow)"/>
    <circle cx="780" cy="55" r="1.4" filter="url(#nodeGlow)"/>
    <circle cx="850" cy="90" r="1.6" filter="url(#nodeGlow)"/>
  </g>
  <circle r="2.2" fill="#ffffff" filter="url(#nodeGlow)" opacity="0.8">
    <animateMotion dur="4s" repeatCount="indefinite" path="M620,50 L700,85"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.2" fill="#ffffff" filter="url(#nodeGlow)" opacity="0.8">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M670,145 L760,165"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="0" width="500" height="230" fill="url(#textShield)"/>
  <rect x="0" y="0" width="900" height="230" fill="url(#vignette)"/>

  <text x="213" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="url(#titleFill)">Moksh Bhalodiya</text>
  <text x="213" y="131" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="13" letter-spacing="3.2" fill="url(#titleFill)">GENERATIVE AI ENGINEER</text>
</svg>
